[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "order-image-serving-pipeline"
version = "0.1.0"
description = "Compress customer-facing commerce images according to order stage"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[tool.setuptools]
py-modules = ["commerce_image_pipeline", "example_order_flow", "order_image_service"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
